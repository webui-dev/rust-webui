<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="webui.js"></script>
    <title>Virtual File System Example</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        color: white;
        background: linear-gradient(to right, #507d91, #1c596f, #022737);
        text-align: center;
        font-size: 18px;
      }
      button {
        padding: 10px;
        margin: 10px;
        border-radius: 3px;
        border: 1px solid #ccc;
        box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        background: #3498db;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
      }
      button:hover { background: #c9913d; }
      h1 { text-shadow: -7px 10px 7px rgb(67 57 57 / 76%); }
      p { max-width: 500px; margin: 0 auto; line-height: 1.6; }
    </style>
  </head>
  <body>
    <h1>WebUI - Virtual File System</h1>
    <br>
    <p>This page is served entirely from memory &mdash; no files are read from disk at runtime.</p>
    <br>
    <button id="Exit">Exit</button>
  </body>
</html>
